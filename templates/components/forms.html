{% macro input(name, label, value='', type='text', autocomplete='off', required=true, placeholder='', readonly=false, disabled=false) %}
<label class="field">
  <span class="field__label">{{ label }}</span>
  <input
    class="field__input"
    type="{{ type }}"
    name="{{ name }}"
    value="{{ value }}"
    autocomplete="{{ autocomplete }}"
    placeholder="{{ placeholder }}"
    {% if required %}required{% endif %}
    {% if readonly %}readonly{% endif %}
    {% if disabled %}disabled{% endif %}
  />
</label>
{% endmacro %}

{% macro button(text, kind='primary', full_width=false) %}
<button class="button button--{{ kind }} {% if full_width %}button--full{% endif %}" type="submit">{{ text }}</button>
{% endmacro %}
