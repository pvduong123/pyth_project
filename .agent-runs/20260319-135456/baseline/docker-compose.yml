services:
  db:
    image: postgres:16-alpine
    container_name: saas-starter-db
    environment:
      POSTGRES_DB: saas_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_starter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
